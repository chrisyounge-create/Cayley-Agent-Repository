name: Collect Part III artifacts into the repository
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download artifacts of the Part III runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          for RID in 37096679842 37174747771 37203982956 37216110242 37216164333; do
            gh run download $RID -D results/$RID || echo "run $RID: nothing downloaded"
          done
          find results -type f | head -50
          du -sh results
      - name: commit
        run: |
          git config user.name "collector"; git config user.email "collector@users.noreply.github.com"
          git add results && git commit -m "Collected Part III artifacts (pathBE runs, splits, hunt)" && git push
