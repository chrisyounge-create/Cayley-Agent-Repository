name: Lean proofs
on:
  push:
    paths: ["lean/**", ".github/workflows/lean.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Eisenstein (certified core) and LogMarkov
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build-args: "Eisenstein LogMarkov EisensteinComponent"
          use-github-cache: false
      - name: Axioms used
        working-directory: lean
        run: |
          cat > Axioms.lean <<'EOT'
          import Eisenstein
          import LogMarkov
          import EisensteinComponent
          #print axioms Eisenstein.mass_criterion
          #print axioms Eisenstein.cuspidal_stable
          #print axioms Eisenstein.eisenstein_component_to_mass
          #print axioms log_markov
          #print axioms Eisenstein.eisenstein_idempotent_step
          #print axioms Eisenstein.deligne_serre_prime
          #print axioms Eisenstein.deligne_serre_lift
          EOT
          lake env lean Axioms.lean
