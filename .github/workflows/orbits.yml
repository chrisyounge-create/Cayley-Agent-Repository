name: Galois-orbit cost at large levels (certified)
on:
  workflow_dispatch:
    inputs:
      levels:
        description: "space-separated prime levels"
        default: "1009 1013 1019 1021 1031 1033 1039 1049 1051 1061 1063 1069 1087 1091 1093 1097 1103 1109 1117 1123"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - id: mk
        run: python3 -c "import json; print('matrix=' + json.dumps('${{ github.event.inputs.levels }}'.split()))" >> $GITHUB_OUTPUT
  orbit:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        N: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy sympy cypari2 python-flint
      - name: main even orbit, certified
        working-directory: ls
        run: timeout 20000 python3 main_orbit2.py ${{ matrix.N }} | grep '^{' > orbit_${{ matrix.N }}.json || echo '{"N": ${{ matrix.N }}, "status": "timeout or failure"}' > orbit_${{ matrix.N }}.json; cat orbit_${{ matrix.N }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ matrix.N }}
          path: ls/orbit_${{ matrix.N }}.json
