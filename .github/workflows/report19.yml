name: Report level-19 analysis to an issue
on:
  workflow_dispatch:
    inputs:
      run_id:
        default: "38021054653"
      p:
        default: "19"
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy cypari2
      - name: fetch and analyse
        working-directory: g2table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.event.inputs.run_id }} -D art 2>&1 | tail -3 || true
          { echo "download listing:"; find art -type f -exec ls -la {} \; ; } > listing.txt 2>&1
          for f in $(find art -name 'g2_iwahori_*.pkl*'); do case "$f" in *.gz) gunzip -c "$f" > "$(basename "${f%.gz}")";; *) cp "$f" .;; esac; done
          ls -la g2_iwahori_*.pkl >> listing.txt 2>&1 || true
          (timeout 6000 python3 analyze19.py ${{ github.event.inputs.p }} > report.txt 2>&1 || true)
          { cat listing.txt; echo; tail -c 55000 report.txt; } > body.txt
          gh issue create --title "Level ${{ github.event.inputs.p }} analysis (run ${{ github.event.inputs.run_id }})" --body-file body.txt
