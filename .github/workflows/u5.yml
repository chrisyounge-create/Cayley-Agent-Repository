name: Part III exact degree-5 operator U at level Q5
on:
  workflow_dispatch:
jobs:
  u5:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        job: [Z0,Z1,Z2,Z3,E0,E1,E2,E3,E4,E5,E6,E7,E8,E9,E10,E11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy sympy cypari2
      - name: compute
        working-directory: f4p5
        continue-on-error: true
        run: |
          SIDE=${{ matrix.job }}; SIDE=${SIDE:0:1}; J=${{ matrix.job }}; J=${J:1}
          NJ=4; if [ "$SIDE" = "E" ]; then NJ=12; fi
          timeout 20500 python3 u5_operator.py $SIDE $J $NJ 19500
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u5-${{ matrix.job }}
          path: f4p5/u5_*.json
