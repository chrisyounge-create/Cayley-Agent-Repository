name = "eisenstein"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Eisenstein"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

[[lean_lib]]
name = "Eisenstein"

[[lean_lib]]
name = "LogMarkov"

[[lean_lib]]
name = "EisensteinComponent"
